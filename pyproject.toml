[project]
name = "ops-sop-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses Depends()/File() in defaults by design

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_pdf.py" = ["E501"]  # long sample paragraphs

[tool.pytest.ini_options]
testpaths = ["tests"]
